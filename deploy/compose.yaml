x-clickhouse-client: &clickhouse-client
  CLICKHOUSE_ADDRESS: clickhouse:9000
  CLICKHOUSE_DATABASE: machine_whisperer
  CLICKHOUSE_USER: analytics
  CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password

x-health: &health
  interval: 5s
  timeout: 4s
  retries: 24
  start_period: 10s

x-app-tracing: &app-tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.01}

x-forward-logs: &forward-logs
  fluentd-address: 127.0.0.1:${MW_FLUENT_FORWARD_PORT:-24224}
  fluentd-async: "true"
  fluentd-buffer-limit: "1024"
  fluentd-retry-wait: 1s
  fluentd-max-retries: "10"
  fluentd-write-timeout: "2s"
  fluentd-sub-second-precision: "true"
  mode: non-blocking
  max-buffer-size: 256k
  cache-disabled: "false"
  cache-max-size: 5m
  cache-max-file: "2"

services:
  nginx:
    logging:
      driver: fluentd
      options:
        <<: *forward-logs
        tag: mw.nginx
    image: nginx:1.31.10-alpine3.24-otel
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-onerep.mooo.com}
      MW_PROVISIONING_CIDR: ${MW_PROVISIONING_CIDR:-127.0.0.1/32}
      MW_NGINX_TRACE_SAMPLE_PERCENT: ${MW_NGINX_TRACE_SAMPLE_PERCENT:-1}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    networks:
      edge:
        ipv4_address: ${MW_PROXY_IP:-172.30.48.2}
      nginx-status:
        aliases: [nginx-status]
      grafana-proxy: {}
      jaeger-proxy: {}
      loki-proxy: {}
      trace-edge: {}
    volumes:
      - ./nginx:/opt/mw/nginx:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/19-machine-whisperer.sh:ro
      - ./nginx/status.conf:/etc/nginx/conf.d/status.conf:ro
      - ${MW_CERT_DIR:-./letsencrypt}:/etc/letsencrypt:ro
      - ${MW_ACME_WEBROOT:-./acme-webroot}:/var/www/acme:ro
    secrets: [internal_ca, jaeger_htpasswd, loki_htpasswd]
    depends_on:
      api: {condition: service_healthy}

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    networks:
      nginx-status: {}
      infra-scrape:
        aliases: [nginx-metrics]
    command:
      - --nginx.scrape-uri=http://nginx-status:8080/stub_status
      - --nginx.timeout=4s
      - --web.listen-address=nginx-metrics:9113
    depends_on:
      nginx: {condition: service_started}

  certbot:
    image: certbot/certbot:v5.10.0
    profiles: [certbot]
    networks: [acme]
    volumes:
      - ${MW_CERT_DIR:-./letsencrypt}:/etc/letsencrypt
      - ${MW_ACME_WEBROOT:-./acme-webroot}:/var/www/acme
    command:
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/acme
      - --cert-name
      - ${DOMAIN:-onerep.mooo.com}
      - -d
      - ${DOMAIN:-onerep.mooo.com}
      - --email
      - "${ACME_EMAIL:-}"

  api:
    logging:
      driver: fluentd
      options:
        <<: *forward-logs
        tag: mw.api
    image: &api-image docker.io/${DOCKERHUB_NAMESPACE:?set DOCKERHUB_NAMESPACE}/machine-whisperer-api:${IMAGE_TAG:-latest}
    build: ../api
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: ${MW_API_IP:-172.30.48.3}
      data: {}
      scrape:
        aliases: [api-metrics]
      trace-apps: {}
    environment:
      <<: *app-tracing
      APP_ENV: ${APP_ENV:-prod}
      API_ADDRESS: ":8443"
      API_METRICS_ADDRESS: api-metrics:9091
      API_TLS_CERT_FILE: /run/secrets/api_cert
      API_TLS_KEY_FILE: /run/secrets/api_key
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_SIGNING_KEY_ID: server-1
      AUTH_SIGNING_KEY_FILE: /run/secrets/signing_key
      AUTH_VERIFY_KEYS_FILE: /run/secrets/verify_keys
      ANALYTICS_URL: http://analytics:8081
      ANALYTICS_INGEST_API_KEY_FILE: /run/secrets/analytics_token
      TRUSTED_PROXY_CIDRS: ${MW_PROXY_IP:-172.30.48.2}/32
    secrets: [api_cert, api_key, internal_ca, database_url, signing_key, verify_keys, analytics_token]
    depends_on:
      api-migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      analytics: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, curl, -fsS, --noproxy, "*", --cacert, /run/secrets/internal_ca, --resolve, "api:8443:127.0.0.1", "https://api:8443/healthz"]

  api-migrate:
    image: *api-image
    entrypoint: [/usr/local/bin/migrate]
    networks: [data]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    logging:
      driver: fluentd
      options:
        <<: *forward-logs
        tag: mw.postgres
    image: &postgres-image postgres:18.7-alpine3.23
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: machine_whisperer
      POSTGRES_USER: machine_whisperer
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    command:
      - postgres
      - -c
      - "log_line_prefix=%m [%p] %e "
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      <<: *health
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, machine_whisperer, -d, machine_whisperer]

  postgres-exporter-setup:
    image: *postgres-image
    entrypoint: [/bin/sh, /opt/mw/postgres/setup-exporter.sh]
    networks: [data]
    environment:
      PGHOST: postgres
      PGUSER: machine_whisperer
      PGDATABASE: machine_whisperer
      PGSSLMODE: disable
      PGCONNECT_TIMEOUT: "5"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_EXPORTER_PASSWORD_FILE: /run/secrets/postgres_exporter_password
    secrets: [postgres_password, postgres_exporter_password]
    volumes:
      - ./postgres:/opt/mw/postgres:ro
    depends_on:
      postgres: {condition: service_healthy}

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    restart: unless-stopped
    networks: [data]
    environment:
      DATA_SOURCE_USER: mw_postgres_exporter
    secrets: [postgres_exporter_password]
    command:
      - --datasource.uri=postgres:5432/machine_whisperer?sslmode=disable&connect_timeout=2
      - --datasource.pass-file=/run/secrets/postgres_exporter_password
      - --collection-timeout=3s
      - --no-collector.stat_statements
    depends_on:
      postgres-exporter-setup: {condition: service_completed_successfully}

  analytics:
    logging:
      driver: fluentd
      options:
        <<: *forward-logs
        tag: mw.analytics
    image: &analytics-image docker.io/${DOCKERHUB_NAMESPACE:?set DOCKERHUB_NAMESPACE}/machine-whisperer-analytics:${IMAGE_TAG:-latest}
    build: ../analytics
    restart: unless-stopped
    networks:
      data: {}
      scrape:
        aliases: [analytics-metrics]
      trace-apps: {}
    environment:
      <<: [*clickhouse-client, *app-tracing]
      APP_ENV: ${APP_ENV:-prod}
      ANALYTICS_METRICS_ADDRESS: analytics-metrics:9091
      ANALYTICS_INGEST_API_KEY_FILE: /run/secrets/analytics_token
    secrets: [clickhouse_password, analytics_token]
    depends_on:
      analytics-migrate: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:8081/healthz"]

  analytics-migrate:
    image: *analytics-image
    entrypoint: [/usr/local/bin/migrate]
    networks: [data]
    environment: *clickhouse-client
    secrets: [clickhouse_password]
    depends_on:
      clickhouse: {condition: service_healthy}

  clickhouse:
    logging:
      driver: fluentd
      options:
        <<: *forward-logs
        tag: mw.clickhouse
    image: clickhouse/clickhouse-server:26.9.36.3
    restart: unless-stopped
    entrypoint: [/bin/bash, /opt/mw/entrypoint.sh]
    networks: [data]
    environment:
      CLICKHOUSE_DB: machine_whisperer
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: [clickhouse_password]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/entrypoint.sh:/opt/mw/entrypoint.sh:ro
      - ./clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/metrics.xml:/etc/clickhouse-server/config.d/metrics.xml:ro
    healthcheck:
      <<: *health
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/clickhouse/8123; printf 'GET /ping HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]

  database-metrics-proxy:
    image: nginx:1.31.10-alpine3.24-slim
    restart: unless-stopped
    networks:
      data: {}
      infra-scrape:
        aliases: [clickhouse-metrics, postgres-metrics]
    volumes:
      - ./nginx/database-metrics.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring, scrape, infra-scrape]
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    networks: [grafana-proxy, monitoring]
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN:-onerep.mooo.com}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_SNAPSHOTS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_METRICS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    restart: unless-stopped
    command: [--config=/etc/otelcol-contrib/config.yaml]
    ports: ["127.0.0.1:${MW_FLUENT_FORWARD_PORT:-24224}:24224"]
    networks:
      trace-edge: {}
      trace-apps: {}
      monitoring:
        aliases: [collector-fluent]
      log-store: {}
    volumes:
      - ./tracing/collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 160MiB
    command: [-config.file=/etc/loki/config.yaml]
    networks: [log-store]
    volumes:
      - ./loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  loki-query-proxy:
    image: nginx:1.31.10-alpine3.24-slim
    restart: unless-stopped
    networks: [monitoring, log-store, loki-proxy]
    volumes:
      - ./nginx/loki-query.conf:/etc/nginx/conf.d/default.conf:ro

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    command: [--config=/etc/jaeger/config.yaml]
    ports: ["127.0.0.1:16686:16686"]
    networks:
      monitoring:
        aliases: [jaeger-otlp]
      jaeger-proxy: {}
    volumes:
      - ./tracing/jaeger.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/tmp

networks:
  edge:
    ipam:
      config:
        - subnet: ${MW_EDGE_SUBNET:-172.30.48.0/28}
  data:
    internal: true
  scrape:
    internal: true
  infra-scrape:
    internal: true
  nginx-status:
    internal: true
  grafana-proxy:
    internal: true
  jaeger-proxy:
    internal: true
  loki-proxy:
    internal: true
  trace-edge:
    internal: true
  trace-apps:
    internal: true
  monitoring: {}
  log-store:
    internal: true
  acme: {}

volumes:
  postgres-data: {}
  clickhouse-data: {}
  prometheus-data: {}
  grafana-data: {}
  jaeger-data: {}
  loki-data: {}

secrets:
  database_url:
    file: ${MW_SECRETS_DIR:-./secrets}/database-url
  postgres_password:
    file: ${MW_SECRETS_DIR:-./secrets}/postgres-password
  postgres_exporter_password:
    file: ${MW_SECRETS_DIR:-./secrets}/postgres-exporter-password
  clickhouse_password:
    file: ${MW_SECRETS_DIR:-./secrets}/clickhouse-password
  analytics_token:
    file: ${MW_SECRETS_DIR:-./secrets}/analytics-token
  signing_key:
    file: ${MW_SECRETS_DIR:-./secrets}/auth-signing.pem
  verify_keys:
    file: ${MW_SECRETS_DIR:-./secrets}/auth-public-keys.json
  internal_ca:
    file: ${MW_SECRETS_DIR:-./secrets}/internal-ca.crt
  api_cert:
    file: ${MW_SECRETS_DIR:-./secrets}/api.crt
  api_key:
    file: ${MW_SECRETS_DIR:-./secrets}/api.key
  grafana_admin_password:
    file: ${MW_SECRETS_DIR:-./secrets}/grafana-admin-password
  jaeger_htpasswd:
    file: ${MW_SECRETS_DIR:-./secrets}/jaeger-htpasswd
  loki_htpasswd:
    file: ${MW_SECRETS_DIR:-./secrets}/loki-htpasswd
