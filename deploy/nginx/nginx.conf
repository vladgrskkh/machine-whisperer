load_module modules/ngx_otel_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $status $mw_log_level {
        ~^5 ERROR;
        ~^4 WARN;
        default INFO;
    }
    map $mw_log_trace_id $mw_log_span_id {
        "" "";
        default $otel_span_id;
    }
    log_format mw_access escape=json '{"level":"$mw_log_level",'
        '"http.response.status_code":$status,"request_id":"$request_id",'
        '"trace_id":"$mw_log_trace_id","span_id":"$mw_log_span_id"}';

    include /etc/nginx/conf.d/*.conf;
}
