map $server_port $metrics_upstream {
    9187 postgres-exporter:9187;
    9363 clickhouse:9363;
}

server {
    listen postgres-metrics:9187;
    listen clickhouse-metrics:9363;
    access_log off;

    # Resolve the fixed backends again when a database container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;
    proxy_connect_timeout 1s;
    proxy_read_timeout 4s;

    location = /metrics {
        if ($request_uri != /metrics) { return 404; }
        if ($request_method != GET) { return 405; }

        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        # ClickHouse 26.9 requires User-Agent when handling a metrics request.
        proxy_set_header User-Agent machine-whisperer-metrics-proxy;
        proxy_pass http://$metrics_upstream/metrics;
    }
    location / {
        return 404;
    }
}
