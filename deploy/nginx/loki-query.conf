server {
    listen 3100;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $loki_backend loki:3100;

    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;

    # Grafana's generic datasource proxy can request arbitrary paths.
    # Forward only the normalized paths used to query and discover logs.
    location ~ ^/loki/api/v1/(query|query_range|labels|label/[A-Za-z_][A-Za-z0-9_]*/values|series|index/(stats|volume|volume_range)|detected_fields|detected_field/[A-Za-z_][A-Za-z0-9_]*/values)$ {
        if ($request_method != GET) {
            return 405;
        }
        proxy_pass http://$loki_backend$uri$is_args$args;
    }

    location / {
        return 404;
    }
}
