basePath: /
definitions:
  Alert:
    properties:
      acknowledged_at:
        format: date-time
        type: string
        x-nullable: true
      id:
        format: uuid
        type: string
      last_z_score:
        format: double
        minimum: 0
        type: number
      machine_id:
        format: uuid
        type: string
      peak_z_score:
        format: double
        minimum: 0
        type: number
      recovered_at:
        format: date-time
        type: string
        x-nullable: true
      recovery_baseline_version:
        format: int64
        minimum: 1
        type: integer
        x-nullable: true
      recovery_device_id:
        format: uuid
        type: string
        x-nullable: true
      recovery_event_id:
        format: uuid
        type: string
        x-nullable: true
      trigger_baseline_version:
        format: int64
        minimum: 1
        type: integer
      trigger_device_id:
        format: uuid
        type: string
      trigger_event_id:
        format: uuid
        type: string
      trigger_mean_rms_g:
        description: Baseline RMS vibration mean at the trigger, in g.
        format: double
        minimum: 0
        type: number
      trigger_stddev_rms_g:
        description: Baseline RMS vibration standard deviation at the trigger, in
          g. Strictly positive.
        format: double
        minimum: 0
        type: number
      trigger_z_score:
        format: double
        minimum: 0
        type: number
      triggered_at:
        format: date-time
        type: string
    required:
    - acknowledged_at
    - id
    - last_z_score
    - machine_id
    - peak_z_score
    - recovered_at
    - recovery_baseline_version
    - recovery_device_id
    - recovery_event_id
    - trigger_baseline_version
    - trigger_device_id
    - trigger_event_id
    - trigger_mean_rms_g
    - trigger_stddev_rms_g
    - trigger_z_score
    - triggered_at
    type: object
  Baseline:
    properties:
      machine_id:
        format: uuid
        type: string
      mean_rms_g:
        description: Mean RMS vibration in g.
        format: double
        minimum: 0
        type: number
      stddev_rms_g:
        description: Standard deviation of RMS vibration in g. Strictly positive.
        format: double
        minimum: 0
        type: number
      updated_at:
        format: date-time
        type: string
      version:
        format: int64
        minimum: 1
        type: integer
    required:
    - machine_id
    - mean_rms_g
    - stddev_rms_g
    - updated_at
    - version
    type: object
  BaselineInput:
    properties:
      mean_rms_g:
        description: Mean RMS vibration in g. Must be finite and nonnegative.
        format: double
        minimum: 0
        type: number
      stddev_rms_g:
        description: Standard deviation of RMS vibration in g. Must be finite and
          strictly positive.
        format: double
        minimum: 0
        type: number
    required:
    - mean_rms_g
    - stddev_rms_g
    type: object
  ClaimPayload:
    properties:
      claim_code:
        description: Independent 32-byte claim secret encoded as canonical unpadded
          base64url.
        maxLength: 43
        minLength: 43
        type: string
      device_id:
        format: uuid
        type: string
      v:
        enum:
        - 1
        type: integer
    required:
    - claim_code
    - device_id
    - v
    type: object
  ClaimedDevice:
    properties:
      device_id:
        format: uuid
        type: string
      machine_id:
        format: uuid
        type: string
      status:
        enum:
        - claimed
        type: string
    required:
    - device_id
    - machine_id
    - status
    type: object
  Credentials:
    properties:
      email:
        description: Trimmed and lowercased before validation. The normalized address
          is at most 254 bytes.
        type: string
      password:
        description: Preserved verbatim. Requires 15–128 Unicode code points and at
          most 512 bytes.
        maxLength: 128
        minLength: 15
        type: string
    required:
    - email
    - password
    type: object
  DeviceClaim:
    properties:
      claim_code:
        description: Single-use claim code from the QR payload, a canonical unpadded
          base64url encoding of 32 bytes.
        maxLength: 43
        minLength: 43
        type: string
      device_id:
        format: uuid
        type: string
      machine_id:
        format: uuid
        type: string
    required:
    - claim_code
    - device_id
    - machine_id
    type: object
  ErrorDetail:
    properties:
      code:
        description: Machine-readable error code.
        type: string
      message:
        description: Human-readable detail. The wording may change.
        type: string
    required:
    - code
    - message
    type: object
  ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/ErrorDetail'
    required:
    - error
    type: object
  HistoryItem:
    properties:
      current_rms_a:
        description: RMS current in amperes, or null when absent.
        format: double
        minimum: 0
        type: number
        x-nullable: true
      device_id:
        format: uuid
        type: string
      dominant_frequency_hz:
        description: Dominant frequency in Hz, or null when absent.
        format: double
        minimum: 0
        type: number
        x-nullable: true
      event_id:
        format: uuid
        type: string
      observed_at:
        format: date-time
        type: string
      operating_state:
        enum:
        - running
        - unknown
        type: string
      received_at:
        format: date-time
        type: string
      schema_version:
        enum:
        - 1
        type: integer
      vibration_rms_g:
        description: RMS vibration in g.
        format: double
        minimum: 0
        type: number
    required:
    - current_rms_a
    - device_id
    - dominant_frequency_hz
    - event_id
    - observed_at
    - operating_state
    - received_at
    - schema_version
    - vibration_rms_g
    type: object
  HistoryPage:
    properties:
      items:
        items:
          $ref: '#/definitions/HistoryItem'
        type: array
      next_cursor:
        description: Opaque cursor for the next page, or null at the end of the history.
        maxLength: 512
        type: string
        x-nullable: true
    required:
    - items
    - next_cursor
    type: object
  Machine:
    properties:
      created_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - created_at
    - id
    - name
    type: object
  MachineName:
    properties:
      name:
        description: After trimming, the name must contain 1–100 Unicode code points
          and no control characters.
        minLength: 1
        type: string
    required:
    - name
    type: object
  Observation:
    properties:
      current_rms_a:
        description: Finite, nonnegative RMS current in amperes when supplied. May
          be omitted or null.
        format: double
        minimum: 0
        type: number
        x-nullable: true
      dominant_frequency_hz:
        description: Finite, nonnegative dominant frequency in Hz when supplied. May
          be omitted or null.
        format: double
        minimum: 0
        type: number
        x-nullable: true
      event_id:
        example: 77777777-7777-4777-8777-777777777777
        format: uuid
        type: string
      observed_at:
        description: Observation timestamp in RFC 3339.
        format: date-time
        type: string
      operating_state:
        enum:
        - running
        - unknown
        type: string
      schema_version:
        enum:
        - 1
        type: integer
      vibration_rms_g:
        description: Finite, nonnegative RMS vibration in g.
        format: double
        minimum: 0
        type: number
    required:
    - event_id
    - observed_at
    - operating_state
    - schema_version
    - vibration_rms_g
    type: object
  ProvisionedDevice:
    properties:
      api_key:
        description: Issued once as <device_id>.<secret>. The secret is 32 bytes encoded
          as unpadded base64url.
        type: string
      claim_payload:
        $ref: '#/definitions/ClaimPayload'
      device_id:
        format: uuid
        type: string
    required:
    - api_key
    - claim_payload
    - device_id
    type: object
  RefreshToken:
    properties:
      refresh_token:
        description: Canonical unpadded base64url encoding of a 32-byte secret.
        maxLength: 43
        minLength: 43
        type: string
    required:
    - refresh_token
    type: object
  TokenPair:
    properties:
      access_token:
        description: User access JWT.
        type: string
      expires_in:
        description: Access token lifetime in seconds. The current API issues tokens
          for 900 seconds.
        example: 900
        type: integer
      refresh_token:
        description: Canonical unpadded base64url encoding of a 32-byte secret.
        maxLength: 43
        minLength: 43
        type: string
      token_type:
        enum:
        - Bearer
        type: string
    required:
    - access_token
    - expires_in
    - refresh_token
    - token_type
    type: object
  User:
    properties:
      created_at:
        format: date-time
        type: string
      email:
        format: email
        maxLength: 254
        type: string
      id:
        format: uuid
        type: string
    required:
    - created_at
    - email
    - id
    type: object
info:
  contact: {}
  description: HTTP API for user accounts, device enrollment, machines, alerts and
    telemetry.
  title: Machine Whisperer API
  version: "1"
paths:
  /healthz:
    get:
      description: Process probe on the API listener.
      operationId: checkProcessHealth
      responses:
        "200":
          description: Process is running.
      summary: Check process health
      tags:
      - operational
  /internal/v1/device-provisioning:
    post:
      description: |-
        Requires the device_provisioner role. Deployment ingress restricts access to the configured manufacturing CIDR.
        The API key is issued once. The separate claim payload is printed on the unit's QR label.
        Shares a per-IP request budget with signup, login, refresh, device provisioning and device claim.
      operationId: provisionDevice
      produces:
      - application/json
      responses:
        "201":
          description: Device credentials and QR claim payload.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ProvisionedDevice'
        "401":
          description: Invalid or missing bearer credentials (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: The user lacks the device_provisioner role (`forbidden`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: The shared per-IP request budget was exceeded (`rate_limited`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            Retry-After:
              description: Seconds until another attempt can be made.
              type: integer
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - UserAccessJWT: []
      summary: Provision a device
      tags:
      - internal
  /v1/alerts/{id}/acknowledge:
    post:
      description: The alert must belong to the caller. Repeated acknowledgements
        preserve the first timestamp and leave the recovery state unchanged.
      operationId: acknowledgeAlert
      parameters:
      - description: Alert UUID.
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Alert acknowledged.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
        "400":
          description: Invalid alert ID (`invalid_input`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid or missing bearer credentials (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: The alert is unavailable to the caller (`alert_not_found`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - UserAccessJWT: []
      summary: Acknowledge an alert
      tags:
      - alerts
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Starts an independent session and returns a user access JWT and refresh token.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown fields and trailing values return 400.
        Shares a per-IP request budget with signup, login, refresh, device provisioning and device claim.
      operationId: logIn
      parameters:
      - description: Email and password.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: Session tokens.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/TokenPair'
        "400":
          description: Invalid email, password or request body (`invalid_input`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unknown email or incorrect password (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: The shared per-IP request budget was exceeded (`rate_limited`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            Retry-After:
              description: Seconds until another attempt can be made.
              type: integer
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Start a user session
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Revokes the session for a current or consumed refresh token.
        Unknown and already revoked well-formed tokens also succeed.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown fields and trailing values return 400.
      operationId: logOut
      parameters:
      - description: Refresh token.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RefreshToken'
      produces:
      - application/json
      responses:
        "204":
          description: Session revoked or already unavailable.
        "400":
          description: Malformed refresh token or request body (`invalid_input`).
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Revoke a user session
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Rotates the refresh token within the existing session and returns a replacement token pair.
        Reusing a consumed token revokes its session if it is still active.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown fields and trailing values return 400.
        Shares a per-IP request budget with signup, login, refresh, device provisioning and device claim.
      operationId: refreshSession
      parameters:
      - description: Current refresh token.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RefreshToken'
      produces:
      - application/json
      responses:
        "200":
          description: Replacement session tokens.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/TokenPair'
        "400":
          description: Malformed refresh token or request body (`invalid_input`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unknown, expired, revoked or reused refresh token (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: The shared per-IP request budget was exceeded (`rate_limited`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            Retry-After:
              description: Seconds until another attempt can be made.
              type: integer
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Rotate session tokens
      tags:
      - auth
  /v1/auth/signup:
    post:
      consumes:
      - application/json
      description: |-
        Creates a user account without starting a session.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown fields and trailing values return 400.
        Shares a per-IP request budget with signup, login, refresh, device provisioning and device claim.
      operationId: signUp
      parameters:
      - description: Email and password.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Credentials'
      produces:
      - application/json
      responses:
        "201":
          description: User created.
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Invalid email, password or request body (`invalid_input`).
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Email is already registered (`email_exists`).
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: The shared per-IP request budget was exceeded (`rate_limited`).
          headers:
            Retry-After:
              description: Seconds until another attempt can be made.
              type: integer
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /v1/devices/claim:
    post:
      consumes:
      - application/json
      description: |-
        Binds the device to a machine owned by the caller and consumes the single-use claim code.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown or duplicate keys and trailing values return 400.
        Shares a per-IP request budget with signup, login, refresh, device provisioning and device claim.
      operationId: claimDevice
      parameters:
      - description: QR claim credentials and selected machine ID.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/DeviceClaim'
      produces:
      - application/json
      responses:
        "200":
          description: Device claimed.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ClaimedDevice'
        "400":
          description: Invalid device ID, machine ID, claim code or request body (`invalid_input`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid or missing bearer credentials (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: The device, claim code or machine is unavailable (`claim_unavailable`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: The shared per-IP request budget was exceeded (`rate_limited`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            Retry-After:
              description: Seconds until another attempt can be made.
              type: integer
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - UserAccessJWT: []
      summary: Claim a device for a machine
      tags:
      - devices
  /v1/devices/me/telemetry:
    post:
      consumes:
      - application/json
      description: |-
        The API derives the machine from the claimed device's binding. Send only observation fields in the body.
        The API assigns the telemetry_writer capability to the authenticated device key.
        Send new observations in nondecreasing timestamp order for the machine. Reuse an event ID with the same values on retry.
        The API normalizes observed_at to UTC microseconds. It accepts observations at most five minutes ahead of database time and strictly less than 30 days old.
        Accepted observations appear in history after export.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown or duplicate keys and trailing values return 400.
      operationId: ingestDeviceTelemetry
      parameters:
      - description: Telemetry observation.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Observation'
      produces:
      - application/json
      responses:
        "202":
          description: Observation durably queued for export or an exact accepted
            retry.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
        "400":
          description: Invalid telemetry observation (`invalid_input`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid or missing bearer credentials (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: The device is unclaimed or revoked, or the machine is unavailable
            to it (`machine_not_found`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The event ID was reused with different values, or the observation
            is out of order or outside its acceptance window (`telemetry_conflict`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - DeviceBearer: []
      summary: Submit a device telemetry observation
      tags:
      - telemetry
  /v1/machines:
    get:
      description: Returns an empty array when the user owns no machines.
      operationId: listMachines
      produces:
      - application/json
      responses:
        "200":
          description: Owned machines.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            items:
              $ref: '#/definitions/Machine'
            type: array
        "401":
          description: Invalid or missing bearer credentials (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - UserAccessJWT: []
      summary: List the user's machines
      tags:
      - machines
    post:
      consumes:
      - application/json
      description: |-
        Creates a machine owned by the authenticated user.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown or duplicate keys and trailing values return 400.
      operationId: createMachine
      parameters:
      - description: Machine name.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/MachineName'
      produces:
