  /v1/machines/{machine_id}/telemetry:
    get:
      description: |-
        The machine must belong to the caller. Observations are available after export.
        Orders by descending observation time, device ID and event ID. Empty pages have an empty items array. An exhausted page has a null next_cursor.
        Provide each of limit and cursor at most once.
      operationId: listMachineTelemetry
      parameters:
      - description: Machine UUID.
        format: uuid
        in: path
        name: machine_id
        required: true
        type: string
      - default: 100
        description: Maximum number of observations.
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to this machine. Use the previous next_cursor.
          Maximum 512 bytes.
        in: query
        maxLength: 512
        minLength: 1
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Telemetry history page.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/HistoryPage'
        "400":
          description: Invalid machine ID, limit or cursor (`invalid_input`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid or missing bearer credentials (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: The machine is unavailable to the caller (`machine_not_found`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: History could not be served. Retry later (`telemetry_unavailable`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - UserAccessJWT: []
      summary: Read machine telemetry history
      tags:
      - telemetry
    post:
      consumes:
      - application/json
      deprecated: true
      description: |-
        Use POST /v1/devices/me/telemetry for new integrations. The path UUID must match the claimed device's assigned machine.
        The API assigns the telemetry_writer capability to the authenticated device key.
        Send new observations in nondecreasing timestamp order for the machine. Reuse an event ID with the same values on retry.
        The API normalizes observed_at to UTC microseconds. It accepts observations at most five minutes ahead of database time and strictly less than 30 days old.
        Accepted observations appear in history after export.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown or duplicate keys and trailing values return 400.
      operationId: ingestMachineTelemetry
      parameters:
      - description: Machine UUID.
        format: uuid
        in: path
        name: machine_id
        required: true
        type: string
      - description: Telemetry observation.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Observation'
      produces:
      - application/json
      responses:
        "202":
          description: Observation durably queued for export or an exact accepted
            retry.
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
        "400":
          description: Invalid machine ID or observation (`invalid_input`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid or missing bearer credentials (`authentication_failed`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
            WWW-Authenticate:
              description: Bearer
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: The device is unclaimed or revoked, or the machine is unavailable
            to it (`machine_not_found`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The event ID was reused with different values, or the observation
            is out of order or outside its acceptance window (`telemetry_conflict`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              type: string
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - DeviceBearer: []
      summary: Submit a telemetry observation by machine ID
      tags:
      - telemetry
