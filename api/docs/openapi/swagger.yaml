securityDefinitions:
  DeviceBearer:
    description: |-
      Send one Authorization header with the complete value Bearer <device_id.secret>.
      The device must be claimed. Authentication supplies the telemetry_writer role.
    in: header
    name: Authorization
    type: apiKey
  UserAccessJWT:
    description: Send one Authorization header with the complete value Bearer <access_token>.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Restricted manufacturing operations.
  name: internal
- description: API listener health probes.
  name: operational
