                $ref: '#/components/schemas/ErrorResponse'
          description: The machine is unavailable to the caller (`machine_not_found`).
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error (`internal_error`).
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: History could not be served. Retry later (`telemetry_unavailable`).
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
      security:
        - UserAccessJWT: []
      summary: Read machine telemetry history
      tags:
        - telemetry
    post:
      deprecated: true
      description: |-
        Use POST /v1/devices/me/telemetry for new integrations. The path UUID must match the claimed device's assigned machine.
        The API assigns the telemetry_writer capability to the authenticated device key.
        Send new observations in nondecreasing timestamp order for the machine. Reuse an event ID with the same values on retry.
        The API normalizes observed_at to UTC microseconds. It accepts observations at most five minutes ahead of database time and strictly less than 30 days old.
        Accepted observations appear in history after export.
        Send one JSON object of at most 8 KiB. Malformed JSON, unknown or duplicate keys and trailing values return 400.
      operationId: ingestMachineTelemetry
