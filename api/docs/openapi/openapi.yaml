          description: Empty binary OTLP ExportTraceServiceResponse (zero bytes)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid trace batch (JSON)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication failed (JSON)
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Trace batch exceeds 32 KiB (JSON)
        "415":
          content:
            application/json:
              schema:
