  /v1/machines/{machine_id}/telemetry:
    get:
      description: |-
        The machine must be active and belong to the caller. Observations are available after export.
        Orders by descending observation time, device ID and event ID. Empty pages have an empty items array. An exhausted page has a null next_cursor.
        Provide each of limit and cursor at most once.
      operationId: listMachineTelemetry
      parameters:
        - description: Machine UUID.
          in: path
          name: machine_id
          required: true
          schema:
            format: uuid
            type: string
        - description: Maximum number of observations.
          in: query
          name: limit
          schema:
            default: 100
            maximum: 1000
            minimum: 1
            type: integer
        - description: Opaque cursor bound to this machine. Use the previous next_cursor. Maximum 512 bytes.
          in: query
          name: cursor
          schema:
            maxLength: 512
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
          description: Telemetry history page.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid machine ID, limit or cursor (`invalid_input`).
