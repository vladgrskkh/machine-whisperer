name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: api
          args: --build-tags=integration --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go test ./... -v -count=1 -race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: make build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: make test-integration

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analytics/go.mod
          cache-dependency-path: analytics/go.sum
      - run: make build test test-integration
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: analytics
          args: --config ../api/.golangci.yml --build-tags=integration --timeout=5m

  deployment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Run deployment contract checks
        run: python3 -B -m unittest discover -s deploy/tests -v
      - name: Run end-to-end checks against the local stack
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B -m unittest -v deploy.tests.e2e

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:check

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build, integration, analytics, deployment, mobile]
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    concurrency:
      group: dockerhub-sha-${{ matrix.service }}-${{ github.sha }}
      queue: max
    strategy:
      matrix:
        service: [api, analytics]
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_PUBLISH_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PUBLISH_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}
      - name: Check for the immutable release image
        id: release
        env:
          RELEASE_IMAGE: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/machine-whisperer-${{ matrix.service }}:sha-${{ github.sha }}
        run: |
          if result=$(docker buildx imagetools inspect "$RELEASE_IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$result" == *"$RELEASE_IMAGE: not found" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v7
        if: steps.release.outputs.exists == 'false'
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/machine-whisperer-${{ matrix.service }}:sha-${{ github.sha }}

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    concurrency:
      group: dockerhub-latest
      queue: max
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_PUBLISH_USERNAME }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PUBLISH_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}
      - name: Promote the current main release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Main has moved. Keeping the existing latest tags."
            exit 0
          fi
          for service in api analytics; do
            image="docker.io/$DOCKERHUB_NAMESPACE/machine-whisperer-$service"
            docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image:sha-$GITHUB_SHA"
          done
