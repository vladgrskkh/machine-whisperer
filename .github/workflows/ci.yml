name: CI

on:
  push:
    branches: [main]
    tags: ['release-[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: api
          args: --build-tags=integration --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Run API unit tests
        run: |
          packages=$(bash ../.github/scripts/api-coverage-packages.sh)
          go test ./... -v -count=1 -race -coverpkg="$packages" -coverprofile="$RUNNER_TEMP/api-unit-coverage.out"
      - name: Export API unit coverage
        continue-on-error: true
        uses: ./.github/actions/go-coverage
        with:
          service: api
          suite: unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: make build
      - run: make swagger-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Run API integration-tagged tests
        run: |
          packages=$(bash ../.github/scripts/api-coverage-packages.sh -tags=integration)
          make test-integration GO_TEST_FLAGS="-coverpkg=$packages -coverprofile=$RUNNER_TEMP/api-integration-coverage.out"
      - name: Export API integration coverage
        continue-on-error: true
        uses: ./.github/actions/go-coverage
        with:
          service: api
          suite: integration

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analytics/go.mod
          cache-dependency-path: analytics/go.sum
      - run: make build
      - name: Run Analytics unit tests
        run: make test GO_TEST_FLAGS="-coverpkg=./cmd/...,./internal/... -coverprofile=$RUNNER_TEMP/analytics-unit-coverage.out"
      - name: Export Analytics unit coverage
        continue-on-error: true
        uses: ./.github/actions/go-coverage
        with:
          service: analytics
          suite: unit
      - name: Run Analytics integration tests
        run: make test-integration GO_TEST_FLAGS="-coverpkg=./internal/... -coverprofile=$RUNNER_TEMP/analytics-integration-coverage.out"
      - name: Export Analytics integration coverage
        continue-on-error: true
        uses: ./.github/actions/go-coverage
        with:
          service: analytics
          suite: integration
          note: Integration coverage reflects the internal packages reached by this suite.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: analytics
          args: --config ../api/.golangci.yml --build-tags=integration --timeout=5m

  coverage:
    needs: [test, integration, analytics]
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      api: ${{ steps.api.outputs.percentage }}
      analytics: ${{ steps.analytics.outputs.percentage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false
      - name: Test profile merging and generated file filtering
        run: go test ../.github/actions/go-coverage/profile.go ../.github/actions/go-coverage/profile_test.go
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          path: ${{ runner.temp }}/coverage-inputs
          merge-multiple: true
      - name: Export merged API coverage
        id: api
        uses: ./.github/actions/go-coverage
        with:
          service: api
          suite: merged
          profiles: |-
            ${{ runner.temp }}/coverage-inputs/api-unit-coverage.out
            ${{ runner.temp }}/coverage-inputs/api-integration-coverage.out
      - name: Export merged Analytics coverage
        id: analytics
        uses: ./.github/actions/go-coverage
        with:
          service: analytics
          suite: merged
          profiles: |-
            ${{ runner.temp }}/coverage-inputs/analytics-unit-coverage.out
            ${{ runner.temp }}/coverage-inputs/analytics-integration-coverage.out

  coverage-badges:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.coverage.outputs.api != '' && needs.coverage.outputs.analytics != ''
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badges
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Publish merged coverage badges
        working-directory: .
        env:
          API_COVERAGE: ${{ needs.coverage.outputs.api }}
          ANALYTICS_COVERAGE: ${{ needs.coverage.outputs.analytics }}
        run: bash .github/scripts/publish-go-coverage-badges.sh

  deployment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Run deployment contract checks
        run: python3 -B -m unittest discover -s deploy/tests -v
      - name: Run end-to-end checks against the local stack
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B -m unittest -v deploy.tests.e2e

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:check

  check-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-') && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag and commit
        id: ref
        working-directory: .
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^release-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release tag of the form release-X.Y.Z.' >&2
            exit 1
          fi
          commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo 'The release tag must point to a commit in main history.' >&2
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  android:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-') && !github.event.deleted
    needs: [check-release, lint, test, build, integration, analytics, deployment, mobile]
    uses: ./.github/workflows/android-apk.yml
    with:
      commit: ${{ needs.check-release.outputs.commit }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-') && !github.event.deleted
    needs: [check-release, lint, test, build, integration, analytics, deployment, mobile]
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    concurrency:
      group: dockerhub-sha-${{ matrix.service }}-${{ needs.check-release.outputs.commit }}
      queue: max
    strategy:
      matrix:
        service: [api, analytics]
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_PUBLISH_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.commit }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PUBLISH_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}
      - name: Check for the immutable release image
        id: release
        env:
          RELEASE_IMAGE: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/machine-whisperer-${{ matrix.service }}:sha-${{ needs.check-release.outputs.commit }}
        run: |
          if result=$(docker buildx imagetools inspect "$RELEASE_IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$result" == *"$RELEASE_IMAGE: not found" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v7
        if: steps.release.outputs.exists == 'false'
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/machine-whisperer-${{ matrix.service }}:sha-${{ needs.check-release.outputs.commit }}

  promote:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-') && !github.event.deleted
    needs: [check-release, publish]
    runs-on: ubuntu-latest
    environment: dockerhub-publish
    concurrency:
      group: dockerhub-latest
      queue: max
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_PUBLISH_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.commit }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PUBLISH_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUBLISH_TOKEN }}
      - name: Publish version tags and promote the newest release
        working-directory: .
        env:
          RELEASE_COMMIT: ${{ needs.check-release.outputs.commit }}
        run: |
          refs=$(git ls-remote --tags --sort=-version:refname origin 'refs/tags/release-*')
          current_commit=$(awk -v ref="$GITHUB_REF" '
            $2 == ref { tag = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : tag) }
          ' <<< "$refs")
          if [[ "$current_commit" != "$RELEASE_COMMIT" ]]; then
            echo 'The release tag changed after this workflow started.' >&2
            exit 1
          fi

          digest_format='{{printf "%s" .Manifest.Digest}}'
          release_sources=()
          for service in api analytics; do
            image="docker.io/$DOCKERHUB_NAMESPACE/machine-whisperer-$service"
            digest=$(docker buildx imagetools inspect "$image:sha-$RELEASE_COMMIT" --format "$digest_format")
            source="$image@$digest"
            version="$image:$GITHUB_REF_NAME"
            if existing=$(docker buildx imagetools inspect "$version" --format "$digest_format" 2>&1); then
              if [[ "$existing" != "$digest" ]]; then
                echo "The version tag $version already points to another image." >&2
                exit 1
              fi
            elif [[ "$existing" == *"$version: not found" ]]; then
              docker buildx imagetools create --prefer-index=false --tag "$version" "$source"
            else
              printf '%s\n' "$existing" >&2
              exit 1
            fi
            release_sources+=("$source")
          done

          newest=$(awk '$2 ~ /^refs\/tags\/release-[0-9]+\.[0-9]+\.[0-9]+$/ { print $2; exit }' <<< "$refs")
          if [[ "$GITHUB_REF" != "$newest" ]]; then
            echo 'A newer release tag exists. Keeping the existing latest tags.'
            exit 0
          fi
          for source in "${release_sources[@]}"; do
            docker buildx imagetools create --prefer-index=false --tag "${source%@*}:latest" "$source"
          done

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-') && !github.event.deleted
    needs: [check-release, android, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.commit }}
          persist-credentials: false
      - name: Require the signed APK artifact ID
        env:
          SIGNED_ARTIFACT_ID: ${{ needs.android.outputs.signed-artifact-id }}
        run: |
          if [[ ! "$SIGNED_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo 'The Android signing job did not return a signed artifact ID.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.android.outputs.signed-artifact-id }}
          path: ${{ runner.temp }}/release-apk
      - name: Publish GitHub Release with verified APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.check-release.outputs.commit }}
        run: bash .github/scripts/publish-android-release.sh "$RUNNER_TEMP/release-apk"
