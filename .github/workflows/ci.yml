name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: api
          args: --build-tags=integration --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go test ./... -v -count=1 -race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: make build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: make test-integration

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analytics/go.mod
          cache-dependency-path: analytics/go.sum
      - run: make build test test-integration
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: analytics
          args: --config ../api/.golangci.yml --build-tags=integration --timeout=5m

  deployment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Test the API migration wrapper
        run: api/scripts/test-migrate.sh
      - name: Test the ClickHouse entrypoint
        run: deploy/clickhouse/test-entrypoint.sh
      - name: Test certificate bootstrap and renewal helpers
        run: deploy/scripts/test-certificates.sh
      - name: Check the Certbot CLI offline
        run: |
          version=$(docker run --rm --network none certbot/certbot:v5.10.0 --version)
          test "$version" = 'certbot 5.10.0'
      - name: Validate the Compose configuration
        run: deploy/scripts/test-compose-config.sh
      - name: Test the backup restore runbook
        run: python3 deploy/scripts/test-runbook-restore.py
      - name: Build the API and Analytics images
        run: docker compose --env-file deploy/.env.server.example -f deploy/compose.yaml build api analytics
      - name: Smoke test the server stack
        env:
          TMPDIR: ${{ runner.temp }}
        run: deploy/scripts/smoke-test.sh

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:check
